# every time you push to github, this checks that the project still installs, passes the safety test and builds.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server and client
        run: npm run install-all
      - name: Check the safety math
        run: npm run test:safety
      - name: Build the website
        run: npm run build
